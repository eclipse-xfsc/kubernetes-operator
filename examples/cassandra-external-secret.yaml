apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ledger-cassandra-credentials
  namespace: ledger
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: openbao
    kind: SecretStore
  target:
    name: ledger-cassandra-credentials
    creationPolicy: Owner
    deletionPolicy: Delete
  data:
    - secretKey: username
      remoteRef:
        key: ledger/ledger-cassandra
        property: username
    - secretKey: password
      remoteRef:
        key: ledger/ledger-cassandra
        property: password
