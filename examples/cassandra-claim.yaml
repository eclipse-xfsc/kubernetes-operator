apiVersion: resources.xfsc.io/v1alpha1
kind: ResourceClaim
metadata:
  name: ledger-cassandra
  namespace: ledger
spec:
  type: cassandra
  providerRef:
    name: cassandra
  externalSecretRef:
    name: ledger-cassandra-credentials
  parameters:
    keyspace: ledger
    replicationFactor: 1
    durableWrites: true
    datacenter: dc1
